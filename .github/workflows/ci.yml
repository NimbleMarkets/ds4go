name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          go -C cmd mod tidy
          git diff --exit-code -- go.mod go.sum cmd/go.mod cmd/go.sum go.work.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./... ./cmd/...

      - name: Vet
        run: go vet ./... ./cmd/...

      - name: Test
        run: go test ./... ./cmd/... -race

      - name: Cross-compile (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build ./... ./cmd/...

      - name: Cross-compile (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build ./... ./cmd/...

  # Validate the release config so a broken .goreleaser.yaml is caught on PRs
  # rather than at tag time.
  goreleaser:
    name: Validate release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
