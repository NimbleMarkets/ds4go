name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Verify both modules and the pinned upstream ABI before releasing.
  check:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          go -C cmd mod tidy
          git diff --exit-code -- go.mod go.sum cmd/go.mod cmd/go.sum go.work.sum
      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./... ./cmd/...
      - name: Vet
        run: go vet ./... ./cmd/...
      - name: Test with race detector
        run: go test ./... ./cmd/... -race

  upstream-sync:
    uses: ./.github/workflows/upstream-sync.yml

  # Build cross-platform archives, publish the GitHub Release, and update the
  # Homebrew cask in NimbleMarkets/homebrew-tap.
  release:
    name: Release
    needs: [check, upstream-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to NimbleMarkets/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Apple signing + notarization of the macOS binaries. When these
          # are unset (e.g. forks), GoReleaser skips notarization.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
